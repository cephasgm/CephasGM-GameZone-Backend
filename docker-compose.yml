# ============================================================
# CephasGM GameZone — Local Development Stack
# ============================================================
# Usage:
#   docker compose up -d          # start everything in background
#   docker compose logs -f api    # tail API logs
#   docker compose down           # stop everything
#   docker compose down -v        # stop AND wipe DB volumes
# ============================================================

services:

  # ----------------------------------------------------------
  # PostgreSQL — main database
  # ----------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: cephasgm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cephasgm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cephasgm_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-cephasgm_gamezone}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cephasgm} -d ${POSTGRES_DB:-cephasgm_gamezone}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - cephasgm-network

  # ----------------------------------------------------------
  # Redis — optional cache / rate limiter / job queue
  # ----------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: cephasgm-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ""
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cephasgm-network

  # ----------------------------------------------------------
  # API — your Node backend
  # ----------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cephasgm-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 5000
      DATABASE_URL: postgresql://${POSTGRES_USER:-cephasgm}:${POSTGRES_PASSWORD:-cephasgm_dev_password}@postgres:5432/${POSTGRES_DB:-cephasgm_gamezone}?schema=public
      REDIS_URL: redis://redis:6379
      REDIS_ENABLED: "true"
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      LOG_PRETTY: "true"
    ports:
      - "${PORT:-5000}:5000"
    volumes:
      # Mount source for hot-reload during development
      - ./src:/app/src:ro
      - ./prisma:/app/prisma:ro
      - ./logs:/app/logs
    networks:
      - cephasgm-network

  # ----------------------------------------------------------
  # pgAdmin — optional GUI for Postgres (browse at :5050)
  # ----------------------------------------------------------
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: cephasgm-pgadmin
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@cephasgm.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - cephasgm-network

# ------------------------------------------------------------
# Named volumes — data persists between restarts
# ------------------------------------------------------------
volumes:
  postgres_data:
    name: cephasgm_postgres_data
  redis_data:
    name: cephasgm_redis_data
  pgadmin_data:
    name: cephasgm_pgadmin_data

# ------------------------------------------------------------
# Internal network — services can reach each other by name
# ------------------------------------------------------------
networks:
  cephasgm-network:
    name: cephasgm-network
    driver: bridge